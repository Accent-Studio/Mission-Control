/* Mockup D: B's studio frame (menus, workspaces, tiled viewports) with project tabs in the title bar like Chrome,
   a rail of Mission Control's pages, A's thin status bar, and Slate as the default theme. */
.win{display:flex;flex-direction:column;height:100vh}

/* title bar: project tabs */
.titlebar{height:calc(46px*var(--k));flex:none;display:flex;align-items:stretch;gap:calc(4px*var(--k));padding-left:calc(8px*var(--k));background:var(--bg)}
.ptabs{display:flex;align-items:flex-end;gap:calc(3px*var(--k));min-width:0;flex:0 1 auto;padding-top:calc(7px*var(--k))}
.ptab{height:calc(39px*var(--k));width:calc(265px*var(--k));flex:0 1 auto;min-width:calc(120px*var(--k));display:flex;align-items:center;gap:calc(9px*var(--k));padding:0 calc(6px*var(--k)) 0 calc(12px*var(--k));border-radius:calc(11px*var(--k)) calc(11px*var(--k)) 0 0;color:var(--text-2);font-size:calc(15px*var(--k));position:relative;cursor:pointer;user-select:none}
.ptab:hover{background:var(--hover);color:var(--text)}
/* a tab dragged along the row: it rides above the others, which slide aside */
.tabdrag .ptab{transition:transform .15s ease}
.tabdrag,.tabdrag *{cursor:grabbing!important;user-select:none}
.ptab.dragging{z-index:5;transition:none;background:var(--bg-2);color:var(--text);box-shadow:0 calc(4px*var(--k)) calc(14px*var(--k)) rgba(0,0,0,.35)}
.tabdrag .ptab:not(.dragging){pointer-events:none}
.ptab .tint{width:calc(22px*var(--k));height:calc(22px*var(--k));font-size:calc(12px*var(--k));border-radius:calc(7px*var(--k))}
.ptab .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ptab .mk{display:inline-flex;align-items:center;gap:calc(3px*var(--k));font-size:calc(13px*var(--k));font-weight:600}
.ptab .mk.warn{color:var(--warn)} .ptab .mk.run{color:#8dbaff}
.ptab .x{width:calc(24px*var(--k));height:calc(24px*var(--k));border-radius:calc(6px*var(--k));display:grid;place-items:center;color:var(--text-3);opacity:0}
.ptab:hover .x,.ptab.on .x{opacity:1}
.ptab .x:hover{background:var(--press);color:var(--text)}
.ptab.on{background:var(--bg-2);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.ptab.on::before{content:"";position:absolute;left:calc(16px*var(--k));right:calc(16px*var(--k));top:0;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 calc(10px*var(--k)) var(--accent),0 0 calc(3px*var(--k)) var(--accent)}
.ptab.last{background:color-mix(in srgb,var(--bg-2) 50%,transparent)}
.ptab.drop{background:var(--accent-soft)}
.ptab.drop::after{content:"Drop here: message box. Hold: open the tab";position:absolute;top:calc(44px*var(--k));left:0;z-index:50;white-space:nowrap;font-size:calc(13px*var(--k));background:var(--raised);border:1px solid var(--line-2);padding:calc(4px*var(--k)) calc(9px*var(--k));border-radius:calc(6px*var(--k));box-shadow:var(--shadow);color:var(--text)}
[data-theme="redline"] .ptab{border-radius:0}

.titlebar .grow{min-width:calc(30px*var(--k))}
.wbtn{width:calc(56px*var(--k));align-self:stretch;display:grid;place-items:center;color:var(--text-2)}
.wbtn:hover{background:var(--hover)} .wbtn.x:hover{background:#c42b1c;color:#fff}

/* second bar: the page's own bar (project, menus, workspaces) */

.pbtn{display:flex;align-items:center;gap:calc(10px*var(--k));height:calc(38px*var(--k));padding:0 calc(12px*var(--k)) 0 calc(8px*var(--k));border-radius:var(--r-sm);font-weight:700;font-size:calc(19px*var(--k));margin-right:calc(8px*var(--k));font-family:var(--head);text-transform:var(--head-case);letter-spacing:var(--head-track)}

.ri{width:calc(58px*var(--k));height:calc(58px*var(--k));border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);position:relative}
.ri::after{content:attr(data-tip);position:absolute;left:calc(100% + calc(12px*var(--k)));top:50%;transform:translate(-4px,-50%);opacity:0;pointer-events:none;white-space:nowrap;z-index:60;font-size:calc(15px*var(--k));font-weight:500;color:var(--text);background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-xs);padding:calc(5px*var(--k)) calc(10px*var(--k));box-shadow:var(--shadow);transition:opacity .12s,transform .12s}

.rail .grow{flex:1}
.fly{width:0;flex:none;overflow:hidden;background:var(--bg);transition:width .18s ease}
.fly.on{width:calc(375px*var(--k))}
.fly-in{width:calc(375px*var(--k));height:100%;display:flex;flex-direction:column}
.fly-h{display:flex;align-items:center;gap:calc(10px*var(--k));padding:calc(15px*var(--k)) calc(15px*var(--k)) calc(5px*var(--k)) calc(20px*var(--k));font-weight:700;font-family:var(--head);text-transform:var(--head-case);letter-spacing:var(--head-track);font-size:calc(19px*var(--k))}
.fly .tree{flex:1;overflow:auto;padding:calc(5px*var(--k)) calc(12px*var(--k)) calc(18px*var(--k))}

.gut{width:calc(8px*var(--k))}.gut.h{height:calc(8px*var(--k))}

[data-theme="redline"] .vp{clip-path:polygon(calc(12px*var(--k)) 0,100% 0,100% calc(100% - calc(12px*var(--k))),calc(100% - calc(12px*var(--k))) 100%,0 100%,0 calc(12px*var(--k)))}
[data-theme="redline"] .vp.focus .vp-head{box-shadow:inset 0 2px 0 var(--accent)}

.spage{flex:1;overflow:auto;padding:calc(8px*var(--k));display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:calc(18px*var(--k));align-content:start}

[data-theme="redline"] .card{clip-path:polygon(calc(12px*var(--k)) 0,100% 0,100% calc(100% - calc(12px*var(--k))),calc(100% - calc(12px*var(--k))) 100%,0 100%,0 calc(12px*var(--k)))}
.card h3{display:flex;align-items:center;gap:calc(10px*var(--k));font:var(--head-weight) calc(15px*var(--k)) var(--head);text-transform:uppercase;letter-spacing:.09em;color:var(--text-2)}

.ruler .now b{position:absolute;top:-2px;left:calc(6px*var(--k));font:600 calc(11px*var(--k)) var(--mono);color:var(--accent)}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;gap:calc(14px*var(--k));align-items:center;padding:calc(10px*var(--k)) calc(6px*var(--k));border-top:1px solid var(--line);font-size:calc(16px*var(--k))}

.sbar .bar{width:calc(75px*var(--k));height:calc(5px*var(--k))}

/* the same soft amber light on the open tab and the selected workspace */
.ptab.on{background:radial-gradient(70% 120% at 50% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%),var(--bg-2)}
.ptab.on::before{height:2px;left:calc(10px*var(--k));right:calc(10px*var(--k));background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent) 70%,transparent);box-shadow:0 0 calc(8px*var(--k)) var(--accent),0 0 calc(18px*var(--k)) calc(3px*var(--k)) color-mix(in srgb,var(--accent) 45%,transparent);opacity:.9}

.ws button.on.glow3d::before{height:2px;width:auto;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent) 70%,transparent)}

/* the open tab is lit from its top edge, the selected workspace from its bottom edge, the same falling light */
.ptab.on{background:linear-gradient(180deg,var(--glow-fall)),var(--bg-2)}
.ptab.on::before{display:none}
.ws button.on.glow3d{background:linear-gradient(0deg,var(--glow-fall)),var(--hl-grad),var(--raised)}
.ws button.on.glow3d::before{display:none}

/* the open tab (top edge) and the selected workspace (bottom edge): the same wash and thin glowing oval */
.ptab.on{background:radial-gradient(70% 120% at 50% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%),var(--bg-2)}
.ptab.on::before{display:block;left:25%;right:25%;top:0;height:calc(3px*var(--k));width:auto;border-radius:50%;background:var(--accent);box-shadow:0 0 calc(7px*var(--k)) var(--accent),0 0 calc(16px*var(--k)) calc(2px*var(--k)) color-mix(in srgb,var(--accent) 40%,transparent);opacity:1}
.ws button.on.glow3d{background:radial-gradient(80% 140% at 50% 100%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 62%),var(--hl-grad),var(--raised)}
.ws button.on.glow3d::before{display:block;left:25%;right:25%;top:auto;bottom:0;height:calc(3px*var(--k));width:auto;border-radius:50%}

.ptab.on::before{left:0;right:0;top:calc(-1.5px*var(--k))}
.ws button.on.glow3d::before{left:0;right:0;bottom:calc(-1.5px*var(--k))}

.ptab.on{overflow:hidden}
/* a rail button keeps its name tip outside, so its oval is cut by itself instead of by the button */
.ri.on{overflow:visible}
.ri.on::before{clip-path:inset(0 calc(-40px*var(--k)) 0 calc(1.5px*var(--k)) round var(--r-sm) 0 0 var(--r-sm))}
.ptab.on::before{background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent) 70%,transparent)}
/* the open tab: 30% softer than the other highlights */
.ptab.on{background:radial-gradient(70% 120% at 50% 0%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 65%),var(--bg-2)}
.ptab.on::before{opacity:.7}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar" id="titlebar">
    <div class="ptabs" id="tabs"></div>
    <span class="grow"></span>
    <button class="wbtn" title="Minimize to the tray">&#8212;</button><button class="wbtn" title="Maximize">&#9744;</button><button class="wbtn x" title="Close to the tray (the server keeps running)">&#10005;</button>
  </div>
  <div class="mbar" id="mbar"></div>
  <div class="body">
    <nav class="rail" id="rail"></nav>
    <aside class="fly" id="fly"><div class="fly-in"><div class="fly-h">Projects<span class="grow"></span><button class="ibtn sm" id="flyX" title="Close the project list"></button></div><div class="tree" id="ptree"></div></div></aside>
    <main class="pages">
      <section class="page" data-page="home"><div class="vpwrap" id="homeVps"></div></section>
      <section class="page" data-page="projects" id="panes"></section>
      <section class="page" data-page="automation"><div class="spage" id="pgAutomation"></div></section>
      <section class="page" data-page="connections"><div class="spage" id="pgConnections"></div></section>
      <section class="page" data-page="usage"><div class="spage" id="pgUsage"></div></section>
      <section class="page" data-page="system"><div class="spage" id="pgSystem"></div></section>
      <section class="page" data-page="settings"><div class="spage" id="pgSettings"></div></section>
    </main>
  </div>
  <div class="sbar" id="sbar"></div>
</div>

<script src="pg-usage.js"></script>

<script>
(() => {
  const { $, $$, icon: I, esc, state: S } = MC;
  const D = MC.data, M = MC.modules;
  if (!S.theme) MC.setTheme('slate');
  if (MC.phone) { MC.phoneStart(); return; } /* a phone: one screen at a time (phone.js), no tabs or panels */
  const clone = (x) => JSON.parse(JSON.stringify(x));

  /* ---------- layouts ----------
     Talk, Plan, Code, Review and Ship are the same in every project. A change is remembered (one for all the projects, one
     for Home, in this browser only) until the saved layout is loaded again; the saved layouts go to every PC (below).
     A parent layout is a workspace in the bar (Talk); its child layouts are saved variants (Talk 2, Talk 3), named after it.
     The ⋯ menu loads one, saves a new parent or child, overwrites the one loaded, or opens Manage layouts (rename, reorder, delete). */
  const WSN = ['Talk', 'Plan', 'Code', 'Review', 'Ship'];
  const HWS = ['Home']; let homeWs = 'Home'; /* Home's own workspaces, and the one on screen */
  const L = { def: {
    Talk: [{ w: 1.5, rows: [{ mod: 'convo', state: { ls: true } }] }, { w: 1, rows: [{ mod: 'overview' }, { mod: 'gallery', h: .85 }] }, { w: .8, rows: [{ mod: 'usage' }, { mod: 'docs', h: .9 }] }],
    Plan: [{ w: 1.7, rows: [{ mod: 'tasks' }] }, { w: 1, rows: [{ mod: 'timeline', h: .9 }, { mod: 'convo' }] }],
    Code: [{ w: 1.1, rows: [{ mod: 'convo' }] }, { w: 1, rows: [{ mod: 'git' }] }, { w: 1, rows: [{ mod: 'docs' }] }],
    Review: [{ rows: [{ mod: 'gallery' }] }, { rows: [{ mod: 'docs' }] }, { rows: [{ mod: 'convo' }] }],
    Ship: [{ w: 1.2, rows: [{ mod: 'overview' }] }, { rows: [{ mod: 'scripts' }, { mod: 'console' }] }, { rows: [{ mod: 'timeline' }, { mod: 'running', state: { view: 'list' }, h: .8 }] }],
    Home: [{ w: .72, rows: [{ mod: 'comlink' }, { mod: 'inbox', h: .72 }] }, { w: 1.5, rows: [{ mod: 'projects' }, { mod: 'timeline', state: { scope: 'all' }, h: .8 }] }, { w: 1, rows: [{ mod: 'brief' }, { mod: 'nextup', h: .9 }, { mod: 'running', state: { scope: 'all', view: 'list' }, h: .75 }] }],
  }, subs: {}, proj: {}, own: {} }; /* own: the workspaces whose default you overwrote or made; only those are saved, so new defaults reach the rest */
  const remKey = (p) => (p === '*home*' ? '*home*' : '*proj*');
  const rec = (p, w) => { const k = remKey(p), r = (L.proj[k] = L.proj[k] || {}); return (r[w] = r[w] || { base: w, cols: null }); };
  const baseOf = (p, w) => { const r = rec(p, w); return r.base === w ? L.def[w] : ((L.subs[w] || {})[r.base] || L.def[w]); };
  const layoutOf = (p, w) => rec(p, w).cols || baseOf(p, w);
  const norm = (l) => JSON.stringify(l.map((c) => ({ w: +(+(c.w || 1)).toFixed(2), rows: c.rows.map((r) => ({ mod: r.mod, tab: r.tab || (M[r.mod].tabs ? M[r.mod].tabs[0] : null), h: +(+(r.h || 1)).toFixed(2), s: ['scope', 'ls', 'lu'].concat(S.work ? [] : ['view']).map((k) => (r.state || {})[k] || '') })) })));
  const modified = (p, w) => { const r = rec(p, w); return !!r.cols && norm(r.cols) !== norm(baseOf(p, w)); };
  const kids = (w) => Object.keys(L.subs[w] || {});
  const allNames = () => WSN.concat(HWS).flatMap((w) => [w, ...kids(w)]);
  const freeName = (base) => { const t = allNames(); if (!t.includes(base)) return base; for (let k = 2; ; k++) if (!t.includes(`${base} ${k}`)) return `${base} ${k}`; };
  const nextKid = (w) => { const t = allNames(); for (let k = 2; ; k++) if (!t.includes(`${w} ${k}`)) return `${w} ${k}`; };
  /* a new name for a parent layout; its child layouts take the new name too (Talk 2 becomes Chat 2) */
  const renameWs = (w, n) => {
    n = (n || '').trim().replace(/\s+/g, ' ');
    if (!n || n === w) return true;
    const mine = [w, ...kids(w)], others = allNames().filter((x) => !mine.includes(x));
    const map = { [w]: n }; kids(w).forEach((k) => (map[k] = n + k.slice(w.length)));
    const taken = Object.values(map).find((x) => others.includes(x));
    if (taken) { MC.toast(`"${taken}" is already taken`, 'x'); return false; }
    [WSN, HWS].forEach((a) => { const i = a.indexOf(w); if (i >= 0) a[i] = n; });
    L.def[n] = L.def[w]; delete L.def[w]; L.own[n] = 1; delete L.own[w];
    if (L.subs[w]) { L.subs[n] = Object.fromEntries(Object.entries(L.subs[w]).map(([k, v]) => [map[k], v])); delete L.subs[w]; }
    Object.values(L.proj).forEach((r) => { if (r[w]) { r[n] = r[w]; r[n].base = map[r[n].base] || n; delete r[w]; } });
    tabs.forEach((t) => { if (t.ws === w) t.ws = n; });
    if (homeWs === w) homeWs = n;
    return true;
  };
  /* show again what a tab or Home shows, after a layout it uses was deleted */
  const reload = (w) => {
    tabs.forEach((t) => { if (t.vps && t.ws === w) t.vps.setLayout(layoutOf(t.project, t.ws)); });
    if (homeWs === w) homeVps.setLayout(layoutOf('*home*', homeWs));
  };
  const deleteWs = (w) => {
    const list = HWS.includes(w) ? HWS : WSN;
    if (list.length < 2) return;
    list.splice(list.indexOf(w), 1);
    delete L.def[w]; delete L.own[w]; delete L.subs[w];
    Object.values(L.proj).forEach((r) => delete r[w]);
    tabs.forEach((t) => { if (t.ws === w) { t.ws = WSN[0]; if (t.vps) t.vps.setLayout(layoutOf(t.project, t.ws)); } });
    if (homeWs === w) { homeWs = HWS[0]; homeVps.setLayout(layoutOf('*home*', homeWs)); }
  };
  const deleteKid = (w, k) => {
    if (!L.subs[w]) return;
    delete L.subs[w][k]; if (!kids(w).length) delete L.subs[w];
    Object.values(L.proj).forEach((r) => { if (r[w] && r[w].base === k) r[w].base = w; });
    reload(w);
  };

  /* ---------- tabs: each shows a page (Home, a project, Usage...), like a browser tab; a project tab keeps its panels built
     and hidden, so switching is instant. A new tab opens on Home. ---------- */
  let tabs = [], cur = null, page = 'projects', seq = 0;
  const loadTabState = (t) => { S.project = t.project; S.session = t.session; S.picked = t.picked; S.draft = t.draft; };
  const saveTabState = () => { if (!cur) return; cur.session = S.session; cur.picked = S.picked; cur.draft = S.draft; };
  const newTab = (project, opts = {}) => { const t = { id: 'tab' + (++seq), project: project || null, page: opts.page || (project ? 'projects' : 'home'), fly: opts.fly != null ? !!opts.fly : !project, ws: opts.ws || WSN[0], session: opts.session || null, picked: new Set(), draft: '', pane: null, vps: null }; if (opts.at != null) tabs.splice(Math.min(opts.at, tabs.length), 0, t); else tabs.push(t); if (!opts.bg) showTab(t); else drawTabs(); return t; };
  const ensurePane = (t) => {
    if (t.pane) return;
    t.pane = document.createElement('div'); t.pane.className = 'pane'; t.pane.innerHTML = '<div class="vpwrap"></div>'; $('#panes').appendChild(t.pane);
    t.vps = new MC.Viewports($('.vpwrap', t.pane), layoutOf(t.project, t.ws), { active: () => page === 'projects' && cur === t, onLayout: (v) => { rec(t.project, t.ws).cols = v.serial(); drawBar(); }, ...dragOpts(() => t.project) });
  };
  /* a panel dragged to another tab (hold it over the tab for half a second, then place it) is copied there; the copy keeps
     showing the project it came from, and its header says so when that is not the tab's project */
  const copyPanel = (fromProject, src, v, host, drop, move) => {
    const toProject = host === homeVps ? null : (tabs.find((x) => x.vps === host) || {}).project || null;
    const state = JSON.parse(JSON.stringify(v.state || {})), shows = state.project || fromProject;
    if (shows && shows !== toProject) state.project = shows; else delete state.project;
    if (!state.project) delete state.session;
    else if (!state.session && v.mod === 'convo') { const ft = tabs.find((x) => x.vps === src); if (ft && ft.session) state.session = ft.session; }
    host.place({ mod: v.mod, tab: v.tab, state }, drop);
    /* Shift held: a move, so the panel leaves its layout (a layout keeps at least one panel) */
    if (move) { if (src.all().length > 1) src.close(v); else MC.toast('Copied: a layout keeps at least one panel', 'layers'); }
  };
  /* dragging a panel: held over a project tab or a Home tab for half a second, that tab opens; dropped there, a copy (or with
     Shift, the panel itself) goes where it is dropped; Esc goes back to the tab the drag started in */
  const dragOpts = (fromProject) => ({
    onHoverTab: (id) => { const x = tabs.find((y) => y.id === id); if (x && ((x.page === 'projects' && x.project) || x.page === 'home')) showTab(x); },
    hostOf: () => (page === 'projects' && cur && cur.vps) || (page === 'home' ? homeVps : null),
    origin: () => cur,
    back: (t) => { if (t && tabs.includes(t)) showTab(t); },
    copyTo: (v, host, drop, move, src) => copyPanel(fromProject(), src, v, host, drop, move),
  });
  const TABS_KEY = 'mc2-tabs', LAY_KEY = 'mc2-layouts';
  /* saved tabs whose project is not known yet at the start (one of Home's or the hub's, read a moment later): they stay in
     the saved list at their place, and open there once the project is known (projects-known below) */
  let waiting = [];
  const saveTabs = () => {
    if (!tabs.length) return;
    saveTabState();
    const out = tabs.map((t) => ({ project: t.project, page: t.page, fly: t.fly, ws: t.ws, session: /^new:/.test(t.session || '') ? null : t.session }));
    const on = out[tabs.indexOf(cur)];
    waiting.forEach((w) => out.splice(Math.min(w.at, out.length), 0, { project: w.project, page: w.page, fly: w.fly, ws: w.ws, session: w.session || null }));
    MC.store.set(TABS_KEY, JSON.stringify({ cur: Math.max(0, out.indexOf(on)), tabs: out }));
    MC.store.set(LAY_KEY, JSON.stringify({ ...layObj(), proj: L.proj, hcur: homeWs }));
    pushLay();
  };

  /* ---------- layouts on every PC ----------
     The layouts are kept by the server too, and through the hub by every PC (server/services/sharedSync.js): a layout
     saved here shows on the other PC, also when that PC was off at the time. The newest save wins, whole. What is
     remembered (L.proj) and which Home workspace is on screen stay with each browser. */
  const DEF0 = clone(L.def), WSN0 = WSN.slice(), HWS0 = HWS.slice();
  const layObj = () => ({ def: Object.fromEntries(Object.keys(L.own).map((w) => [w, L.def[w]])), own: L.own, subs: L.subs, wsn: WSN, hws: HWS });
  const noProj = (v) => { const o = { ...(v || {}) }; delete o.proj; return o; }; /* a shared copy from before the remembered state stayed here */
  /* the remembered state was once kept per project: that one is set aside (kept, in case) and starts again for all */
  const oneProj = (pj) => {
    const o = pj && typeof pj === 'object' ? pj : {};
    if (Object.keys(o).some((k) => k !== '*home*' && k !== '*proj*')) { MC.store.set('mc2-layouts-per-project', JSON.stringify(o)); return o['*home*'] ? { '*home*': o['*home*'] } : {}; }
    return o;
  };
  const SYNC_AT = 'mc2-layouts-at'; /* the shared copy this browser last had; none: it never joined */
  let pushedJson = null, pushT = null;
  const pushLay = () => {
    const j = JSON.stringify(layObj()); if (j === pushedJson) return;
    clearTimeout(pushT);
    pushT = setTimeout(() => {
      const v = layObj(), jj = JSON.stringify(v); if (jj === pushedJson) return;
      MC.api.put('/api/shared/layouts', { value: v }).then((d) => { pushedJson = jj; MC.store.set(SYNC_AT, d.at); }).catch(() => { /* the server is restarting: the next save tries again */ });
    }, 1200);
  };
  /* puts a saved layout set in place, from this browser or from the shared copy */
  const applyLay = (l) => {
    if (!l || typeof l !== 'object') return;
    L.def = clone(DEF0); L.own = l.own && typeof l.own === 'object' ? l.own : {};
    Object.keys(L.own).forEach((w) => { if (l.def && l.def[w]) L.def[w] = l.def[w]; else delete L.own[w]; });
    L.subs = l.subs || {}; if (l.proj) L.proj = oneProj(l.proj);
    [[WSN, l.wsn, WSN0], [HWS, l.hws, HWS0]].forEach(([a, sv, d0]) => { const ok = (Array.isArray(sv) ? sv : []).filter((w, i) => L.def[w] && sv.indexOf(w) === i); a.splice(0, a.length, ...(ok.length ? ok : d0.filter((w) => L.def[w]))); });
  };
  /* the first time a browser meets the shared copy, what it had of its own is added to it: the shared copy wins where both
     have the same layout */
  const mergeLay = (sh, mine) => {
    const out = clone(sh); out.own = out.own || {}; out.def = out.def || {}; out.subs = out.subs || {}; out.proj = out.proj || {};
    const names = () => new Set([...(out.wsn || []), ...(out.hws || [])].flatMap((w) => [w, ...Object.keys(out.subs[w] || {})]));
    [['wsn', WSN0], ['hws', HWS0]].forEach(([k, d0]) => { out[k] = out[k] || d0.slice(); (mine[k] || []).forEach((w) => { if (!out[k].includes(w) && !names().has(w) && (DEF0[w] || (mine.def || {})[w])) { out[k].push(w); if ((mine.own || {})[w]) { out.own[w] = 1; out.def[w] = mine.def[w]; } } }); });
    Object.keys(mine.own || {}).forEach((w) => { if (!out.own[w] && (mine.def || {})[w]) { out.own[w] = 1; out.def[w] = mine.def[w]; } });
    Object.entries(mine.subs || {}).forEach(([w, ks]) => Object.entries(ks || {}).forEach(([k, v]) => { if (!names().has(k)) (out.subs[w] = out.subs[w] || {})[k] = v; }));
    delete out.proj;
    return out;
  };
  /* a new shared copy while the page is open: the open tabs whose layout changed show the new one */
  const takeLay = (v, at) => {
    v = noProj(v);
    if (JSON.stringify(v) === JSON.stringify(layObj())) { MC.store.set(SYNC_AT, at); return; }
    const before = tabs.map((t) => JSON.stringify(layoutOf(t.project, t.ws))), homeBefore = JSON.stringify(layoutOf('*home*', homeWs));
    applyLay(v);
    tabs.forEach((t, i) => { if (!WSN.includes(t.ws)) t.ws = WSN[0]; if (t.vps && JSON.stringify(layoutOf(t.project, t.ws)) !== before[i]) t.vps.setLayout(layoutOf(t.project, t.ws)); });
    if (!HWS.includes(homeWs)) homeWs = HWS[0];
    if (JSON.stringify(layoutOf('*home*', homeWs)) !== homeBefore) homeVps.setLayout(layoutOf('*home*', homeWs));
    pushedJson = JSON.stringify(layObj());
    MC.store.set(LAY_KEY, JSON.stringify({ ...layObj(), proj: L.proj, hcur: homeWs })); MC.store.set(SYNC_AT, at);
    drawBar();
  };
  const loadShared = async () => {
    let d; try { d = await MC.api.get('/api/shared/layouts'); } catch (e) { return; }
    if (d && d.value != null) d.value = noProj(d.value);
    const mine = layObj(), joined = !!MC.store.get(SYNC_AT);
    if (!d || d.value == null) { pushedJson = null; pushLay(); return; } /* the first PC to share: its own go up */
    if (d.at === MC.store.get(SYNC_AT) && JSON.stringify(d.value) === JSON.stringify(mine)) { pushedJson = JSON.stringify(mine); return; }
    if (!joined && JSON.stringify(d.value) !== JSON.stringify(mine)) {
      MC.store.set('mc2-layouts-before-sync', JSON.stringify(mine)); /* kept, in case the merge is not wanted */
      takeLay(mergeLay(d.value, mine), d.at); pushedJson = null; pushLay(); return;
    }
    takeLay(d.value, d.at);
  };
  let layReady = false; /* the tabs are up (start, below) */
  MC.events.on('shared', (d) => { if (layReady && d && d.key === 'layouts' && d.at !== MC.store.get(SYNC_AT)) loadShared(); });
  MC.on('session', () => saveTabs());
  const showTab = (t) => {
    saveTabState(); cur = t; loadTabState(t);
    if (t.page === 'projects' && !t.project) t.page = 'home';
    page = t.page;
    if (page === 'projects') { if (t.vps) { const want = layoutOf(t.project, t.ws); if (norm(want) !== norm(t.vps.serial())) t.vps.setLayout(want); } ensurePane(t); }
    tabs.forEach((x) => x.pane && x.pane.classList.toggle('on', x === t));
    lockCover();
    setFly(!!t.fly);
    showPage(); if (page === 'projects') t.vps.wake();
  };
  const closeTab = (t) => {
    if (tabs.length === 1) { MC.toast('The last tab stays open', 'x'); return; }
    const i = tabs.indexOf(t); tabs.splice(i, 1); if (t.pane) t.pane.remove();
    if (t === cur) { cur = null; showTab(tabs[Math.min(i, tabs.length - 1)]); } else drawTabs();
  };
  const drawTabs = () => {
    if (tabDrag && tabDrag.on) { tabDrag.redraw = true; return; } /* a tab being dragged keeps its element; drawn at the drop */
    $('#tabs').innerHTML = tabs.map((t) => {
      const cls = t === cur ? 'on' : '';
      if (t.page !== 'projects') { const pg = PAGES.concat([['settings', 'gear', 'Settings']]).find((x) => x[0] === t.page) || PAGES[0]; return `<div class="ptab ${cls}" data-tab="${t.id}" title="${esc(pg[2])}"><span class="tint pgi">${I(pg[1], 'sm')}</span><span class="nm">${esc(pg[2])}</span><button class="x" data-close="${t.id}" title="Close tab (Ctrl W)">${I('x', 'sm')}</button></div>`; }
      const p = MC.projectInfo(t.project), need = D.inbox.filter((x) => x.proj === t.project).length;
      return `<div class="ptab ${cls}" data-tab="${t.id}" title="${esc(t.project)} · ${t.ws}"><span class="tint" style="background:${p.tint}">${esc(t.project[0])}</span><span class="nm">${esc(t.project)}</span>`
        + (need ? `<span class="mk warn" title="${need} need you">${I('clock', 'sm')}${need}</span>` : p.running ? `<span class="mk run" title="${p.running} running">${I('loader', 'sm')}${p.running}</span>` : '')
        + `<button class="x" data-close="${t.id}" title="Close tab (Ctrl W)">${I('x', 'sm')}</button></div>`;
    }).join('') + `<button class="ibtn sm newtab" data-newtab title="New tab (Ctrl T)">${I('plus', 'sm')}</button>`;
    saveTabs();
  };
  $('#tabs').addEventListener('click', (e) => {
    if (Date.now() - tabDropAt < 250) return; /* the click that ends a drag */
    const x = e.target.closest('[data-close]'); if (x) { closeTab(tabs.find((t) => t.id === x.dataset.close)); return; }
    if (e.target.closest('[data-newtab]')) { newTab(null, { page: 'home' }); return; }

    now.sort((a, b) => a.at - b.at).forEach((w) => newTab(w.project, { page: w.page, fly: w.fly, ws: WSN.includes(w.ws) ? w.ws : WSN[0], session: w.session || null, at: w.at, bg: !(w.wasCur && cur === firstTab) }));
    saveTabs();
  });
  addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === ' ') { e.preventDefault(); const v = page === 'home' ? homeVps : cur.vps; v.maxed = v.maxed ? null : v.focused; v.render(); }
    if (e.ctrlKey && e.key === '.') { e.preventDefault(); MC.setWork(!S.work); }
    if (e.altKey && /^[1-9]$/.test(e.key) && tabs[+e.key - 1]) showTab(tabs[+e.key - 1]);
  });
  MC.D = { tabs: () => tabs, cur: () => cur, showTab, newTab: (n, o) => newTab(n, o), drawTabs: () => tabs.length && drawTabs(), drawSbar, drawRail: () => tabs.length && drawRail(), allVps: () => tabs.flatMap((t) => (t.vps ? t.vps.all() : [])).concat(homeVps ? homeVps.all() : []), drawBar: () => tabs.length && drawBar(), drawTree: () => { if (fly.classList.contains('on')) MC.renderProjectTree($('#ptree'), treeOpts); }, saveTabs, setPage: (p) => { if (p === 'projects') showTab(cur); else { page = p; showPage(); } }, L };
})();
