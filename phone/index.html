<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e16" />
    <title>Mission Control</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header class="brand">
        <svg class="clawd mark" viewBox="-9 -6 18 12" shape-rendering="crispEdges" aria-hidden="true">
          <g class="cl-body"><rect x="-6" y="-4" width="12" height="7" /><rect class="cl-arm l" x="-8" y="-1" width="2" height="2" /><rect class="cl-arm r" x="6" y="-1" width="2" height="2" /></g>
          <g class="cl-legs"><rect class="a" x="-5" y="3" width="1" height="2" /><rect class="b" x="-3" y="3" width="1" height="2" /><rect class="a" x="2" y="3" width="1" height="2" /><rect class="b" x="4" y="3" width="1" height="2" /></g>
          <g class="cl-eyes"><rect x="-4" y="-2" width="1" height="2" /><rect x="3" y="-2" width="1" height="2" /></g>
        </svg>
        <span class="brand-name">Mission Control</span>
      </header>

      <section id="view-trip" class="trip" hidden aria-hidden="true">
        <div class="sky"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
        <div class="hop">
          <svg class="clawd big" viewBox="-9 -6 18 12" shape-rendering="crispEdges" aria-hidden="true">
            <g class="cl-body"><rect x="-6" y="-4" width="12" height="7" /><rect class="cl-arm l" x="-8" y="-1" width="2" height="2" /><rect class="cl-arm r" x="6" y="-1" width="2" height="2" /></g>
            <g class="cl-legs"><rect class="a" x="-5" y="3" width="1" height="2" /><rect class="b" x="-3" y="3" width="1" height="2" /><rect class="a" x="2" y="3" width="1" height="2" /><rect class="b" x="4" y="3" width="1" height="2" /></g>
            <g class="cl-eyes"><rect x="-4" y="-2" width="1" height="2" /><rect x="3" y="-2" width="1" height="2" /></g>
          </svg>
          <span class="shadow"></span>
        </div>
      </section>

      <section id="view-loading" class="view center" hidden>
        <h1>Starting</h1>
      </section>

      <section id="view-enter" class="view center" hidden>
        <h1>Connecting<span id="enter-pc"></span></h1>
        <p class="lead" id="enter-lead" role="status" hidden></p>
        <div class="track" role="progressbar" aria-label="Connecting"><i></i></div>
      </section>

      <section id="view-pair" class="view" hidden>
        <h1>Pair with <em>your PC</em> or the hub</h1>
        <p id="pair-note" class="note" hidden></p>
        <p class="lead">On your PC, open Mission Control, go to Connections and choose Pair a phone. Then scan the QR code, or paste the pairing text.</p>

        <label for="name">Name for this phone</label>
        <input id="name" type="text" maxlength="40" autocomplete="off" spellcheck="false" value="Phone" />

        <button id="scan" class="primary" type="button" hidden>Scan QR code</button>

        <label for="paste">Pairing text</label>
        <textarea id="paste" rows="3" placeholder="missioncontrol-pair:..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <button id="pair" class="secondary" type="button" disabled>Pair</button>

        <div id="confirm" class="confirm" role="alertdialog" aria-labelledby="confirm-text" hidden>
          <p id="confirm-text"></p>
          <div class="row">
            <button id="replace-main" class="primary" type="button">Replace the first</button>
            <button id="replace-second" class="primary" type="button">Replace the second</button>
            <button id="cancel" class="quiet" type="button">Cancel</button>
          </div>
        </div>

        <p id="pair-error" class="error" role="alert" hidden></p>

        <div id="places" class="known" aria-label="Places this phone is paired with" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
